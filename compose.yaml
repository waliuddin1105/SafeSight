services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment: {}
    command:
    - python
    - -m
    - alembic
    - upgrade
    - head
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      MODELS_ROOT: /app/models
      MEDIA_ROOT: /app/artifacts/media
    ports:
    - 127.0.0.1:5000:5000
    volumes:
    - ./models:/app/models:ro
    - media:/app/artifacts/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health/live')
      interval: 20s
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      MODELS_ROOT: /app/models
      MEDIA_ROOT: /app/artifacts/media
    command:
    - python
    - -m
    - safesight.worker
    volumes:
    - ./models:/app/models:ro
    - media:/app/artifacts/media
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  media: null
