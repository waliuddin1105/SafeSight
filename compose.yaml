services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safesight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-safesight}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 10
  migrate:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safesight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-safesight}
    command: [python, -m, alembic, upgrade, head]
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safesight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-safesight}
      MODELS_ROOT: /app/models
      MEDIA_ROOT: /app/artifacts/media
    ports: ['127.0.0.1:5000:5000']
    volumes: ['./models:/app/models:ro', 'media:/app/artifacts/media']
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health/live')"]
      interval: 20s
  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safesight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-safesight}
      MODELS_ROOT: /app/models
      MEDIA_ROOT: /app/artifacts/media
    command: [python, -m, safesight.worker]
    volumes: ['./models:/app/models:ro', 'media:/app/artifacts/media']
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  postgres:
  media:
